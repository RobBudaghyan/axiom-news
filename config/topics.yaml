# Topic list. Users subscribe to topics; the hourly AI pass tags each story with them.
#   tag:        internal id, stored in the database. Never rename an existing tag
#               (users' saved choices refer to it); add a new one instead.
#   label:      what users see, per language. v1 shows only `en`; `ru` is kept
#               ready for when Russian is added.
#   emoji:      shown next to the label in the Mini App.
#   definition: given to the AI so it knows what belongs here and what doesn't.
#               (Old-project lesson: a bare label alone caused wrong tags.)
#   default:    new users start subscribed to it.
topics:
  - tag: politics_conflicts
    label: {en: "Politics & Conflicts", ru: "Политика и конфликты"}
    emoji: "🏛️"
    default: true
    definition: >-
      Government, elections, legislation, diplomacy, sanctions, major court rulings, and
      armed conflicts anywhere in the world: military operations, attacks, terrorism,
      ceasefires, peace talks, arms deliveries and major defence developments. Any
      country, Russia's domestic politics included. Stories about the Ukraine war or an
      Iran war also get this tag. Not: economy and market news (that is economy_markets)
      unless a government decision is the core of the story, technology (that is
      tech_ai), celebrity news, sports, lifestyle.

  - tag: economy_markets
    label: {en: "Economy & Markets", ru: "Экономика и рынки"}
    emoji: "📈"
    default: true
    definition: >-
      Economies and economic data (growth, inflation, jobs), central banks and interest
      rates, stock, bond and currency markets when they move a lot, trade deals and
      tariffs, energy and commodity prices, and big company news with wide impact (a
      giant firm collapses, a huge merger, a market-moving decision). Not: routine
      company news (products, mid-size results, executive changes), a day's market
      moves with no event behind them, stock tips. A tech company's results or a chip
      deal is economy_markets only when it moves the wider market; otherwise tech_ai.

  - tag: tech_ai
    label: {en: "Technology & AI", ru: "Технологии и ИИ"}
    emoji: "💻"
    default: true
    definition: >-
      Technology with wide impact: artificial intelligence (new frontier models, AI
      companies and their deals, AI rules and safety), chips and semiconductors (export
      controls, supply, big chipmakers), the big tech companies (major launches, antitrust
      and regulation, large deals, layoffs at scale), cybersecurity (major hacks, data
      breaches, ransomware against public services), space, and science or tech policy with
      wide impact. Not: gadget reviews, ordinary product launches and updates, app tips,
      games, mid-size start-up funding rounds, rumours, and IT outages that end the same
      day with no wider effect.

  - tag: armenia
    label: {en: "Armenia", ru: "Армения"}
    emoji: "🇦🇲"
    default: true
    definition: >-
      Armenia's politics, economy, security and foreign relations; Armenia-Azerbaijan
      relations, border and peace process; Armenia's relations with Russia, Turkey,
      Iran, Georgia, the EU and the US; the Armenian diaspora when politically
      significant. Not: news about Azerbaijan or Turkey with no Armenia connection.

  - tag: iran_war
    label: {en: "Iran War", ru: "Война в Иране"}
    emoji: "🇮🇷"
    default: true
    definition: >-
      Military confrontation involving Iran (with Israel, the US or others) and its
      direct spillover: strikes, interceptions, proxy attacks tied to it (Houthis,
      Hezbollah, Iraqi militias), shipping attacks in the Gulf/Red Sea, nuclear
      programme strikes and talks, and incidents in neighbouring countries caused by
      the conflict. Not: Iranian domestic news with no link to the conflict; the
      Israel-Hamas war in Gaza, the West Bank or Israeli domestic politics when the
      item does not involve Iran (those are politics_conflicts).

  - tag: ukraine_war
    label: {en: "Ukraine War", ru: "Война на Украине"}
    emoji: "🇺🇦"
    default: true
    definition: >-
      Russia's war against Ukraine: front-line events, strikes on cities and
      infrastructure, military aid, peace negotiations, prisoner exchanges, and
      war-related sanctions. Not: Ukrainian domestic news with no link to the war.
