# Google News search queries for the coverage experiment (Step 6, SHADOW MODE ONLY).
# The hourly job fetches each query as an RSS feed and stores what it finds in separate
# shadow tables (shadow_items, shadow_runs). Nothing here reaches the live story pool,
# digests or users. See reports/step-06-coverage-experiment.md.
#
# Edit freely: add, remove or reword queries here; no code change is needed.
#
#   editions   Google News country/language editions. Each is the hl/gl/ceid triple that
#              Google's own site uses. A query names the edition it runs in.
#   window     Google's "when:" operator added to every query (e.g. 2h, 1d): only articles
#              Google dates inside that window come back.
#   topics     per topic tag (config/topics.yaml), a list of queries:
#                q    the search text, exactly as typed into Google News. Quotes mean an exact
#                     phrase, OR means either word.
#                ed   the edition to search (a key of `editions`)
#   enabled    false switches the whole shadow step off.

# Paused on 2026-11-14 (Step 7): the coverage gap was our own feeds, not Google. The code and the
# shadow_* tables are kept for later reuse (custom topics such as "Colombia" with no curated feed).
# With false, the hourly workflow's shadow step exits before any D1 or Google request.
enabled: false
window: 2h
timeout_s: 8          # per request; the whole step has its own budget (job/shadow.py)
# Title similarity (0-1, rarity-weighted shared words) at which a Google result counts as the
# same article/event as one already in the live pool or found earlier. Tuned by eye on 668 real
# results on 2026-11-14: 0.5-0.7 was mostly the same event from another outlet, below 0.5 mixed.
# Every score is stored, so part B can re-judge with another value.
title_dup_threshold: 0.5

editions:
  en: {hl: en-US, gl: US, ceid: "US:en"}
  ru: {hl: ru, gl: RU, ceid: "RU:ru"}
  hy: {hl: hy, gl: AM, ceid: "AM:hy"}   # not a real edition: Google answers in Russian (unused)

topics:
  armenia:
    - {q: "Armenia", ed: en}
    - {q: "Pashinyan", ed: en}
    - {q: "Yerevan", ed: en}
    - {q: "Karabakh OR \"Armenia Azerbaijan\"", ed: en}
    - {q: "Армения", ed: ru}
    - {q: "Пашинян", ed: ru}
    - {q: "Ереван", ed: ru}
    # Armenian script: Google News barely indexes Armenian-language outlets (2026-11-14:
    # "Հայաստան" and "Փաշինյան" gave 0 items in 2 h and 0-2 in a day in every edition; the
    # hy/AM edition answers with Russian results). "Երևան" in the English edition gave a few,
    # so it stays as the one Armenian-script test query.
    - {q: "Երևան", ed: en}
  russia:
    - {q: "Kremlin", ed: en}
    - {q: "Putin", ed: en}
    - {q: "\"Russia\" sanctions", ed: en}
    - {q: "Кремль", ed: ru}
    - {q: "Госдума", ed: ru}
  ukraine_war:
    - {q: "Ukraine war", ed: en}
    - {q: "Zelensky", ed: en}
    - {q: "Ukraine peace talks", ed: en}
    - {q: "ВСУ", ed: ru}
    - {q: "Зеленский", ed: ru}
  iran_war:
    - {q: "Iran strike OR Iran attack", ed: en}
    - {q: "Hormuz OR Houthis", ed: en}
    - {q: "Iran nuclear", ed: en}
    - {q: "Иран удар", ed: ru}
  wars_conflicts:
    - {q: "airstrike OR shelling", ed: en}
    - {q: "ceasefire", ed: en}
    - {q: "Gaza OR Sudan OR Sahel", ed: en}
    - {q: "\"armed clashes\" OR rebels", ed: en}
  politics:
    - {q: "election results", ed: en}
    - {q: "\"prime minister\" OR president resigns OR parliament vote", ed: en}
    - {q: "sanctions OR tariffs", ed: en}
    - {q: "выборы", ed: ru}
