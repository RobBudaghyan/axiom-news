# RSS/Atom news sources. Every feed here passed scripts/check_feeds.py
# (HTTP 200, valid RSS/Atom, items from the last 7 days, article links).
# Re-check any time with:  venv/Scripts/python scripts/check_feeds.py
#
# Fields
#   key          stable internal id (stored in the database; never rename)
#   name         shown to users next to the link in digests
#   url          feed URL
#   region       global | russia | armenia | middle_east | ukraine (balance/stats only)
#   language     feed language (en, ru, hy, fa, uk); the AI writes summaries in English
#   topics       topic tags (config/topics.yaml) this feed MAINLY covers. A hint for
#                humans and stats only; the AI tags each story from its content.
#   paywalled    true if most articles need a subscription (fine; we still link them)
#   state_owned  true if a government owns the outlet or is its main funder. This is a
#                factual ownership/funding label, not a judgment: it covers both
#                state-controlled media (TASS, RT, IRNA) and editorially independent
#                public broadcasters (BBC, DW). `note` explains which.
#   tier         prestige used to pick the best link for a story with several sources:
#                1 = top international prestige, 2 = solid / reputable, 3 = niche,
#                partisan or state-propaganda outlets (kept for coverage, linked last)
#   note         optional clarification (ownership, editorial line)
#
# Checked from the owner's PC on 2026-11-13. Results from GitHub's US servers may differ.

