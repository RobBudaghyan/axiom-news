# Step 6 feasibility probe: does Google News RSS answer from GitHub's servers?
# Start it by hand: Actions tab -> "gnews probe" -> Run workflow. Needs no secrets, writes nothing.
name: gnews probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe Google News RSS
        run: python scripts/gnews_probe.py --json gnews-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: gnews-probe
          path: gnews-probe.json
