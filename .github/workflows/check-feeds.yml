# Feed health check from GitHub's own servers (some sites block US data centres).
# Start it by hand: Actions tab -> "check feeds" -> Run workflow. Needs no secrets.
name: check feeds

on:
  workflow_dispatch:
    inputs:
      all:
        description: "Also re-test feeds marked enabled: false"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check every feed
        run: python scripts/check_feeds.py ${{ inputs.all && '--all' || '' }} --json feeds.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: feed-check
          path: feeds.json
