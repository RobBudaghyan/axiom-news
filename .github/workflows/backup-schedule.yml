# Backup trigger only. The Worker normally starts the hourly job at about :07. This schedule
# runs at :37 and does nothing if a run started in the last 45 minutes, so it only matters
# when the Worker trigger failed.
# Kept in its own file on purpose: GitHub disables scheduled workflows in a public repo after
# 60 days without repository activity, and that must never disable hourly.yml itself (which
# the Worker starts through the API).
name: backup schedule

on:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: read

jobs:
  hourly:
    uses: ./.github/workflows/hourly.yml
    with:
      min_gap_minutes: "45"
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
