<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card</title>
<!-- Share cards for the owner: 1080 x 1080 and 1080 x 1920 (540 x 540 / 540 x 960 at 2x). The logo
     (which is the name), one factual line, the bot's address, and the top of a real digest rising from
     the bottom edge. setup({lang, shape: "square" | "story"}). -->
<link rel="stylesheet" href="shared.css">
<style>
  body { background: var(--red); color: #fff; }
  .page { position: absolute; inset: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
  .lockup { display: block; }
  .line { margin: 0; text-wrap: balance; text-align: center; font-weight: 600; letter-spacing: -0.018em; line-height: 1.25; }
  .addr { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: 0.01em; color: rgba(255, 255, 255, 0.72); }
  .chat { width: 452px; position: relative; flex: 1 1 auto; }
  .chat .msg { position: absolute; left: 0; right: 0; top: 0; color: var(--ink);
    box-shadow: 0 30px 80px rgba(60, 0, 0, 0.35); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .square .lockup { width: 168px; margin-top: 52px; }
  .square .line { font-size: 21px; max-width: 420px; margin-top: 26px; }
  .square .addr { margin-top: 10px; }
  .square .chat { margin-top: 30px; }
  .story .lockup { width: 236px; margin-top: 120px; }
  .story .line { font-size: 27px; max-width: 440px; margin-top: 40px; }
  .story .addr { font-size: 17px; margin-top: 14px; }
  .story .chat { margin-top: 64px; }
</style>
<script src="digest.js"></script>
</head>
<body>
<div class="page" id="page">
  <img class="lockup" src="logo-lockup.svg" alt="Axiom News">
  <p class="line" id="line"></p>
  <p class="addr">t.me/axiom_news_bot</p>
  <div class="chat"><div class="msg" id="msg"></div></div>
</div>
<script>
  const LINE = { en: "A short digest of the important news, a few times a day.",
                 ru: "Короткая сводка важных новостей несколько раз в день." };
  window.setup = async ({ lang, shape }) => {
    document.documentElement.lang = lang;
    document.getElementById("page").className = `page ${shape}`;
    document.getElementById("line").textContent = LINE[lang];
    await loadDigest(document.getElementById("msg"), lang, shape === "story" ? 5 : 2);
    await document.fonts.ready;
  };
</script>
</body>
</html>
