<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How it works</title>
<!-- Step 19: THE welcome video (worker/public/media/welcome.mp4) and the bot clip. 11 s, 1280 x 720
     (640 x 360 CSS px at 2x), no words, so one file fits every language; loops cleanly (t = 11 is t = 0,
     plain red).
     0.0-1.2  the logo animation of branding/source/anim.html (short timings, as welcome-1280x720.mp4)
     1.65-2.8 the logo rises and fades, then a WIDE settings screen in the Mini App's light style comes up
     2.9-5.0  topics switch on (two columns: the six main topics, then the custom Formula 1)
     5.0-5.6  slide to the digest times; 5.7-6.9 three times picked, the next-digest card appears
     7.4-8.0  slide to the chat; 8.1-9.0 the digest arrives
     10.2-11  the screen fades out to plain red
     Labels are soft bars; only emoji, times and switches show. -->
<link rel="stylesheet" href="kit.css">
<style>
  body { background: #b1161c; overflow: hidden; }
  #logo { position: absolute; inset: 0; width: 100%; height: 100%; will-change: transform, opacity; }
  /* the screen: 560 x 316 CSS px of the 640 x 360 frame, drawn at 700 x 395 and scaled 0.8 */
  .screen { position: absolute; left: 40px; top: 22px; width: 700px; height: 395px; transform-origin: 0 0;
    background: #f2f2f7; border-radius: 32px; overflow: hidden; will-change: transform, opacity;
    box-shadow: 0 2px 4px rgba(60, 0, 0, 0.12), 0 40px 90px rgba(60, 0, 0, 0.38); --shadow: none; }
  .view { position: absolute; inset: 0; padding: 30px 26px 0; will-change: transform, opacity; }
  .bar { display: block; height: 13px; border-radius: 7px; background: rgba(0, 0, 0, 0.13); }
  .bar.t { height: 30px; border-radius: 10px; background: rgba(0, 0, 0, 0.82); width: 170px; margin: 4px 0 18px 4px; }
  .bar.s { height: 10px; background: rgba(0, 0, 0, 0.09); margin: 0 0 9px 4px; }
  .row .bar { flex: 0 0 auto; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .col2 .group + .bar.s { margin-top: 18px; }
  .next { display: flex; align-items: center; gap: 14px; height: 76px; padding: 0 16px; margin-top: 18px; }
  .next .clock { flex-basis: 46px; width: 46px; height: 46px; }
  .chat { padding: 0; background: #f2f2f7; }
  .chat .top { height: 84px; background: rgba(255, 255, 255, 0.92); border-bottom: 0.5px solid rgba(60, 60, 67, 0.2);
    display: flex; align-items: flex-end; gap: 12px; padding: 0 22px 13px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: #b1161c; display: grid; place-items: center; overflow: hidden; }
  .avatar svg { width: 31px; }
  .bubble { position: absolute; left: 18px; width: 470px; bottom: 22px; border-radius: 20px 20px 20px 6px; padding: 16px 18px 30px; }
  .bubble .pill { height: 30px; border-radius: 9px; border: 1px solid rgba(60, 60, 67, 0.16); background: rgba(177, 22, 28, 0.06);
    display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px 0 14px; }
  .bubble .story { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .bubble .story .emo { height: 17px; vertical-align: 0; margin: 0; }
  .bubble .quote { border-left: 3px solid #b1161c; background: rgba(177, 22, 28, 0.06); border-radius: 3px 8px 8px 3px; padding: 9px 10px 1px; margin: 4px 0 14px; }
  .bubble .quote .bar { height: 9px; margin-bottom: 8px; background: rgba(0, 0, 0, 0.1); }
  .bubble .time { position: absolute; right: 14px; bottom: 9px; font-size: 13px; color: #8e8e93; font-variant-numeric: tabular-nums; }
  .grid .btn { font-size: 16px; letter-spacing: -0.02em; }
  .red { background: rgba(177, 22, 28, 0.55) !important; }
</style>
<script src="../../source/logo-paths.js"></script>
<script src="kit.js"></script>
</head>
<body>
<svg id="logo" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs><clipPath id="barclip"><rect id="clip" /></clipPath></defs>
  <g id="lockup">
    <rect id="lbar" fill="#fff" />
    <g clip-path="url(#barclip)"><path id="laxiom" fill="#b1161c" /></g>
    <path id="lnews" fill="#fff" />
  </g>
</svg>
<div class="screen">
  <div class="view v-topics"></div>
  <div class="view v-times"></div>
  <div class="view chat v-chat"></div>
</div>
<script>
  const VW = 700;                       // the views' width (CSS px before the 0.8 scale)
  const SCALE = 0.8;
  // ---- the logo, exactly as branding/source/anim.html with setup({short: true})
  const L = window.LOGO, [bx, by, bw, bh] = L.bar, newsBottom = 220 * 1024 / 320;
  const k = (640 * 0.47) / bw, lockH = (newsBottom - by) * k;
  const ox = 320 - (bx + bw / 2) * k, oy = 180 - lockH / 2 - by * k;
  const byId = (id) => document.getElementById(id);
  byId("lockup").setAttribute("transform", `translate(${ox} ${oy}) scale(${k})`);
  byId("laxiom").setAttribute("d", L.axiom.d);
  byId("lnews").setAttribute("d", L.news.d);
  const clip = byId("clip");
  clip.setAttribute("x", bx); clip.setAttribute("y", by); clip.setAttribute("width", bw); clip.setAttribute("height", bh);
  const LT = { bar: [0.12, 0.70], axiom: [0.34, 0.88], news: [0.62, 1.16] };
  function logoFrame(t) {
    const b = inOutCubic(prog(t, ...LT.bar));
    const bar = byId("lbar");
    bar.setAttribute("x", bx); bar.setAttribute("y", by); bar.setAttribute("height", bh);
    bar.setAttribute("width", Math.max(0, bw * b));
    const a = outQuart(prog(t, ...LT.axiom));
    byId("laxiom").setAttribute("transform", `translate(0 ${(1 - a) * bh * 0.9}) ${L.axiom.transform}`);
    const n = outQuart(prog(t, ...LT.news));
    byId("lnews").setAttribute("opacity", n);
    byId("lnews").setAttribute("transform", `translate(0 ${(1 - n) * bh * 0.35}) ${L.news.transform}`);
    const out = inOutCubic(prog(t, 1.65, 2.15));   // the logo rises a little and fades as the screen comes up
    const svg = byId("logo");
    svg.style.opacity = (1 - out).toFixed(4);
    svg.style.transform = `translateY(${(-out * 26).toFixed(2)}px) scale(${(1 - out * 0.08).toFixed(4)})`;
  }

  // ---- the screen
  const W1 = [150, 160, 140, 84], W2 = [100, 118];   // label bar widths (the names' lengths, roughly)
  const vT = $(".v-topics"), vTi = $(".v-times"), vC = $(".v-chat"), screen = $(".screen");
  const row = ([e, tint], w) => `<div class="row"><span class="sq" style="background: rgba(${tint}, 0.18)">${emo(e, "")}</span>` +
    `<span class="bar" style="width:${w}px"></span><span style="flex:1"></span><span class="switch"><span class="knob"></span></span></div>`;
  vT.innerHTML = `<span class="bar t"></span><span class="bar s" style="width:58px"></span>` +
    `<div class="cols"><div class="group">${TOPICS.slice(0, 4).map((t, i) => row(t, W1[i])).join("")}</div>` +
    `<div class="col2"><div class="group">${TOPICS.slice(4).map((t, i) => row(t, W2[i])).join("")}</div>` +
    `<span class="bar s" style="width:76px"></span><div class="group">${row(CUSTOM, 104)}</div></div></div>`;
  vTi.innerHTML = `<span class="bar t"></span><span class="bar s" style="width:96px"></span>` +
    `<div class="grid">${TIMES.map((x) => btn(x)).join("")}</div>` +
    `<div class="group next"><span class="clock">${CLOCK}</span><span style="flex:1"><span class="bar s" style="width:90px;margin:0 0 9px"></span>` +
    `<span class="bar" style="width:170px;height:16px;background:rgba(0,0,0,.75)"></span></span></div>`;
  const story = (emos, w1, w2, quote) => `<div class="story">${emos.map((e) => emo(e)).join("")}<span class="bar" style="width:${w1}px;background:rgba(0,0,0,.7)"></span></div>` +
    `<div class="story"><span class="bar" style="width:${w2}px;background:rgba(0,0,0,.7)"></span><span class="bar red" style="width:58px"></span></div>` +
    (quote ? `<div class="quote"><span class="bar" style="width:96%"></span><span class="bar" style="width:88%"></span><span class="bar" style="width:62%"></span></div>` : "");
  vC.innerHTML = `<div class="top"><span class="avatar">${lockupSVG()}</span><span><span class="bar" style="width:120px;height:13px;background:rgba(0,0,0,.75);margin-bottom:7px"></span>` +
    `<span class="bar" style="width:52px;height:10px"></span></span></div>` +
    `<div class="msg bubble"><span class="bar" style="width:230px;background:rgba(0,0,0,.75)"></span>` +
    `<div class="pill">${emo("💻")}<span class="bar" style="width:130px;height:11px"></span></div>` +
    story(["🇺🇸", "🇨🇳"], 300, 190, true) + story(["🇪🇺", "🤝"], 270, 150, false) +
    `<span class="time">14:00</span></div>`;
  // the avatar is the logo's colours on red: white bar, red AXIOM, white NEWS
  document.body.style.setProperty("--logo-bar", "#fff"); document.body.style.setProperty("--logo-axiom", "#b1161c");
  document.body.style.setProperty("--logo-news", "#fff");

  const rowsT = $$(".row", vT), btns = $$(".btn", vTi), next = $(".next", vTi), bubble = $(".bubble", vC);
  const ON = [0, 1, 2, 6, 3, 5];   // the order the switches turn on (6 = the custom topic)
  const PICK = [3, 8, 14];         // 09:00, 14:00, 20:00
  const slide = (el, x, o) => { el.style.transform = `translateX(${x.toFixed(2)}px)`; el.style.opacity = o.toFixed(4); };
  const D = 2.4;                   // the how-it-works part starts here (its old timeline, shifted)

  window.setup = async () => { await document.fonts.ready; await imagesReady(); window.frame(0); return true; };
  window.frame = (t) => {
    logoFrame(t);
    const up = outCubic(prog(t, 2.1, 2.8)), gone = inOutCubic(prog(t, 10.2, 11.0));
    screen.style.opacity = (up * (1 - gone)).toFixed(4);
    screen.style.transform = `translateY(${((1 - up) * 40 + gone * 10).toFixed(2)}px) scale(${SCALE})`;
    const u = t - D;
    rowsT.forEach((r) => setSwitch(r, 0));
    ON.forEach((i, n) => { const a = 0.5 + n * 0.28; setSwitch(rowsT[i], outCubic(prog(u, a, a + 0.32))); });
    const s1 = inOutCubic(prog(u, 2.6, 3.2)), s2 = inOutCubic(prog(u, 5.0, 5.6));
    btns.forEach((b) => setBtn(b, 0));
    PICK.forEach((i, n) => { const a = 3.35 + n * 0.32; setBtn(btns[i], outCubic(prog(u, a, a + 0.3))); });
    const nk = outCubic(prog(u, 4.3, 4.8));
    next.style.opacity = nk; next.style.transform = `translateY(${(1 - nk) * 14}px)`;
    slide(vT, -VW * s1, 1);
    slide(vTi, VW * (1 - s1) - VW * s2, s1 > 0 ? 1 : 0);
    slide(vC, VW * (1 - s2), s2 > 0 ? 1 : 0);
    const bk = outCubic(prog(u, 5.7, 6.6));
    bubble.style.opacity = bk;
    bubble.style.transform = `translateY(${((1 - bk) * 60).toFixed(2)}px)`;
  };
</script>
</body>
</html>
