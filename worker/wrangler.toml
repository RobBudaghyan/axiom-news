# Cloudflare Worker for Axiom News (TEST bot during development).
# Secrets are NOT here. They are set with `wrangler secret put` (scripts/set_secrets.py):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, OWNER_TELEGRAM_ID, GITHUB_DISPATCH_TOKEN
name = "axiom-news"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# The Mini App (public/app/) is served as static assets: free, and served before the Worker code runs.
# public/_headers sets no-store on the page and caching on the hashed files (lesson 12).
[assets]
directory = "./public"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[triggers]
# */5: send due digests and check the job's health. 7 * * * *: start the hourly GitHub job.
crons = ["*/5 * * * *", "7 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "axiom-d1"
database_id = "2a1eb212-95b8-4715-b628-2967cbcb0367"

[vars]
GITHUB_REPO = "RobBudaghyan/axiom-news"
GITHUB_WORKFLOW = "hourly.yml"
GITHUB_REF = "main"
# The Mini App address used by the bot's Open settings button and the chat menu button.
APP_URL = "https://axiom-news.axiom-news-worker.workers.dev/app/"

[observability]
enabled = true
